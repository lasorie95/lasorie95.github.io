<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">주문 시스템의 유스케이스 다이어그램</title>
  <desc id="desc">사용자 액터가 주문하기와 연결된다. 주문하기에서 결제하기로 include 점선 화살표가 향하고, 쿠폰 적용에서 주문하기로 조건부 extend 점선 화살표가 향한다.</desc>
  <defs>
    <marker id="open-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L10 5L1 9" fill="none" stroke="#495943" stroke-width="2"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #373a2c; font-size: 20px; }
    .title { font-size: 24px; font-weight: bold; }
    .line { stroke: #495943; stroke-width: 2; fill: none; }
    .relation { stroke: #495943; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#open-arrow); }
  </style>
  <rect width="1000" height="540" fill="#faf5e7"/>
  <text class="title" x="500" y="42" text-anchor="middle">유스케이스 다이어그램 — 기능과 관계</text>
  <rect x="300" y="85" width="655" height="410" fill="none" stroke="#495943" stroke-width="2"/>
  <text x="320" y="118">주문 시스템</text>
  <circle class="line" cx="95" cy="146" r="18"/>
  <path class="line" d="M95 164V219 M60 185H130 M95 219L69 258 M95 219L121 258"/>
  <text x="95" y="294" text-anchor="middle">사용자</text>
  <text x="95" y="323" text-anchor="middle">(액터)</text>
  <path class="line" d="M130 200H395"/>
  <text x="250" y="181" text-anchor="middle">이용</text>
  <ellipse cx="505" cy="200" rx="110" ry="45" fill="#e6dfc8" stroke="#495943" stroke-width="2"/>
  <text x="505" y="207" text-anchor="middle">주문하기</text>
  <ellipse cx="815" cy="200" rx="110" ry="45" fill="#e6dfc8" stroke="#495943" stroke-width="2"/>
  <text x="815" y="207" text-anchor="middle">결제하기</text>
  <path class="relation" d="M615 200H705"/>
  <text x="660" y="149" text-anchor="middle">«include»</text>
  <ellipse cx="505" cy="395" rx="110" ry="45" fill="#e6dfc8" stroke="#495943" stroke-width="2"/>
  <text x="505" y="402" text-anchor="middle">쿠폰 적용</text>
  <path class="relation" d="M505 350V245"/>
  <text x="530" y="288">«extend»</text>
  <text x="530" y="322">[쿠폰 사용 시]</text>
</svg>
