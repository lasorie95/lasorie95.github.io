{% assign category_posts = site.categories[include.category] %}
{% if category_posts.size > 0 %}
<div class="entries-list">
  {% for post in category_posts %}{% include archive-single.html type="list" %}{% endfor %}
</div>
{% else %}
<div class="world-empty"><p>아직 등록된 {{ include.category | escape }} 글이 없습니다.</p></div>
{% endif %}
